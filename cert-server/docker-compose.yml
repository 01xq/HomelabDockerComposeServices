services:
  cert-server:
    image: nginx:alpine
    container_name: cert-server
    restart: unless-stopped
    volumes:
      - ../traefik/certs:/usr/share/nginx/html:ro
    networks:
      homelab:
        ipv4_address: 172.20.0.20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cert-server.rule=Host(`cert.local`)"
      - "traefik.http.routers.cert-server.entrypoints=websecure"
      - "traefik.http.routers.cert-server.tls=true"
      - "traefik.http.services.cert-server.loadbalancer.server.port=80"

networks:
  homelab:
    external: true
